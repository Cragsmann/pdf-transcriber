# $schema: https://raw.githubusercontent.com/knative/func/main/schema/func_yaml-schema.json
# yaml-language-server: $schema=https://raw.githubusercontent.com/knative/func/main/schema/func_yaml-schema.json
specVersion: 0.36.0
name: pdf-transcriber
runtime: quarkus
registry: image-registry.openshift-image-registry.svc:5000/pdf-transcriber
namespace: pdf-transcriber
created: 2026-08-10T13:41:31.81093+02:00
build:
  buildEnvs:
  - name: BP_NATIVE_IMAGE
    value: "false"
  - name: BP_JVM_VERSION
    value: "21"
  - name: MAVEN_S2I_ARTIFACT_DIRS
    value: target/quarkus-app
  - name: S2I_SOURCE_DEPLOYMENTS_FILTER
    value: lib quarkus-run.jar app quarkus
run:
  envs:
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    value: itpc-gcp-hcm-pe-eng-claude
  - name: CLOUD_ML_REGION
    value: us-east5
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: '{{ secret:gcp-adc:application_default_credentials.json }}'
